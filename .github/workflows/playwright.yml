name: Playwright Tests

# WHEN THIS RUNS:
# - Every push to main (so we know main is never broken)
# - Every pull request targeting main (so we catch problems before merging)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      # 1. Get the repository's code onto the CI runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install the Node.js version this project was built with
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install project dependencies from package.json / package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Download the actual browser binaries Playwright drives.
      #    --with-deps also installs the OS-level libraries those browsers need.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5. Run the full suite headlessly.
      #    API tests need REQRES_API_KEY — stored as a GitHub Actions secret,
      #    never committed to the repo. Add it under
      #    Settings > Secrets and variables > Actions > New repository secret.
      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          BASE_URL: ${{ vars.BASE_URL || 'https://automationexercise.com' }}
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://reqres.in/api' }}
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      # 6. Upload the HTML report as a build artifact even if tests failed,
      #    so it can be downloaded and inspected from the Actions run page.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
